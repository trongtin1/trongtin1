        <rect width="105" height="28" rx="6" fill="#0c1e3d" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="52.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e0f2fe">.NET / C#</text>
      </g>
      <!-- Badge 2: React 19 -->
      <g transform="translate(115, 0)">
        <rect width="105" height="28" rx="6" fill="#0c1e3d" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="52.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e0f2fe">ReactJS / TS</text>
      </g>
      <!-- Badge 3: SQL Server -->
      <g transform="translate(230, 0)">
        <rect width="115" height="28" rx="6" fill="#0c1e3d" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="57.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e0f2fe">SQL &amp; Postgres</text>
