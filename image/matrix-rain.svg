<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient - Deep Midnight Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glass HUD Gradient -->
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1d38" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#070e1c" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#0ea5e9" flood-opacity="0.75" />
    </filter>
  </defs>

  <style>
    @keyframes techFall {
      0% { transform: translateY(-440px); opacity: 0; }
      8% { opacity: 0.95; }
      92% { opacity: 0.95; }
      100% { transform: translateY(360px); opacity: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.92; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3)); }
      50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(14, 165, 233, 0.65)); }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .tech-col {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2.5px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      user-select: none;
    }

    .c1  { animation: techFall 4.2s linear infinite 0.1s; }
    .c2  { animation: techFall 3.1s linear infinite 0.9s; }
    .c3  { animation: techFall 5.0s linear infinite 1.5s; }
    .c4  { animation: techFall 3.6s linear infinite 0.3s; }
    .c5  { animation: techFall 4.8s linear infinite 2.1s; }
    .c6  { animation: techFall 3.3s linear infinite 1.1s; }
    .c7  { animation: techFall 4.5s linear infinite 0.6s; }
    .c8  { animation: techFall 3.8s linear infinite 1.9s; }
    .c9  { animation: techFall 5.2s linear infinite 0.4s; }
    .c10 { animation: techFall 3.5s linear infinite 1.4s; }
    .c11 { animation: techFall 4.1s linear infinite 2.3s; }
    .c12 { animation: techFall 3.9s linear infinite 0.8s; }
    .c13 { animation: techFall 4.7s linear infinite 1.7s; }
    .c14 { animation: techFall 3.4s linear infinite 0.2s; }
    .c15 { animation: techFall 4.9s linear infinite 2.5s; }
    .c16 { animation: techFall 3.7s linear infinite 1.3s; }
    .c17 { animation: techFall 4.3s linear infinite 0.7s; }
    .c18 { animation: techFall 3.2s linear infinite 2.0s; }
    .c19 { animation: techFall 5.1s linear infinite 1.0s; }
    .c20 { animation: techFall 3.8s linear infinite 0.5s; }
    .c21 { animation: techFall 4.4s linear infinite 1.8s; }
    .c22 { animation: techFall 3.6s linear infinite 0.7s; }

    .head-token { fill: #ffffff; font-weight: 900; }
    .bright-token { fill: #bae6fd; }
    .mid-token { fill: #38bdf8; opacity: 0.9; }
    .dark-token { fill: #0284c7; opacity: 0.6; }
    .dim-token { fill: #075985; opacity: 0.35; }

    .hud-box {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .cursor {
      animation: cursorBlink 0.9s infinite;
    }
  </style>

  <!-- Deep Slate Midnight Background -->
  <rect width="960" height="320" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="280" x2="960" y2="280" />
    
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="240" y1="0" x2="240" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="560" y1="0" x2="560" y2="320" />
    <line x1="640" y1="0" x2="640" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="880" y1="0" x2="880" y2="320" />
  </g>

