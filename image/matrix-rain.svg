  <g class="tech-rain-streams">
    <!-- Col 1: .NET -->
    <text x="25" y="0" class="tech-col c1">
      <tspan class="head-token">·</tspan><tspan class="head-token">.</tspan><tspan class="bright-token">N</tspan><tspan class="bright-token">E</tspan><tspan class="mid-token">T</tspan><tspan class="mid-token">·</tspan><tspan class="dark-token">C</tspan><tspan class="dark-token">#</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 2: REACT -->
    <text x="65" y="0" class="tech-col c2">
      <tspan class="head-token">R</tspan><tspan class="bright-token">E</tspan><tspan class="bright-token">A</tspan><tspan class="mid-token">C</tspan><tspan class="mid-token">T</tspan><tspan class="dark-token">1</tspan><tspan class="dark-token">9</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 3: C# -->
    <text x="105" y="0" class="tech-col c3">
      <tspan class="head-token">C</tspan><tspan class="bright-token">#</tspan><tspan class="mid-token">·</tspan><tspan class="mid-token">A</tspan><tspan class="dark-token">S</tspan><tspan class="dark-token">P</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 4: TYPESCRIPT -->
    <text x="145" y="0" class="tech-col c4">
      <tspan class="head-token">T</tspan><tspan class="bright-token">Y</tspan><tspan class="bright-token">P</tspan><tspan class="mid-token">E</tspan><tspan class="mid-token">S</tspan><tspan class="dark-token">C</tspan><tspan class="dark-token">R</tspan><tspan class="dim-token">I</tspan><tspan class="dim-token">P</tspan><tspan class="dim-token">T</tspan>
    </text>

    <!-- Col 5: SQL SERVER -->
    <text x="190" y="0" class="tech-col c5">
