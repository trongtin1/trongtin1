          font-family="'Segoe UI', 'Inter', sans-serif" 
          font-size="13" font-weight="400" 
          fill="#94a3b8" letter-spacing="0.5">
      Building robust backend architectures, scalable systems &amp; intelligent AI workflows
    </text>

    <!-- Tech Stack Mini Badges -->
    <g transform="translate(65, 172)">
      <!-- Badge 1: .NET -->
