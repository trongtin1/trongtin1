  <!-- ================= CENTRAL GLASS TERMINAL CARD ================= -->
  <g class="hud-box" transform="translate(130, 45)">
    <!-- Outer Frame -->
    <rect x="0" y="0" width="700" height="230" rx="14" ry="14" 
          fill="url(#hudGrad)" 
          stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.65" />

    <!-- Inner Border Highlight -->
    <rect x="3" y="3" width="694" height="224" rx="12" ry="12" 
          fill="none" 
          stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />

    <!-- Header Bar -->
    <rect x="0" y="0" width="700" height="38" rx="14" ry="14" fill="#081021" fill-opacity="0.92" />
    <line x1="0" y1="38" x2="700" y2="38" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

    <!-- Window Dots -->
    <circle cx="24" cy="19" r="6" fill="#ef4444" opacity="0.85" />
    <circle cx="44" cy="19" r="6" fill="#f59e0b" opacity="0.85" />
    <circle cx="64" cy="19" r="6" fill="#10b981" opacity="0.85" />

    <!-- Window Title -->
    <text x="350" y="24" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#93c5fd" letter-spacing="1.5" opacity="0.9">
      trongtin1@dev: ~/portfolio
    </text>

    <!-- Top Right System Tag -->
    <text x="675" y="24" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#38bdf8" font-weight="bold" opacity="0.9">
      [ACTIVE]
    </text>

    <!-- Corner Accents -->
    <path d="M 12 50 L 12 44 L 18 44" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 688 50 L 688 44 L 682 44" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 12 214 L 12 220 L 18 220" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 688 214 L 688 220 L 682 220" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.75" />

    <!-- Main Name Header -->
    <text x="350" y="88" text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Outfit', 'Segoe UI', sans-serif" 
          font-size="32" font-weight="800" letter-spacing="3" 
          fill="#ffffff" filter="url(#textShadow)">
      NGUYEN TRONG TIN
    </text>

    <!-- Subtitle Role -->
    <text x="350" y="122" text-anchor="middle" 
          font-family="'JetBrains Mono', Consolas, monospace" 
          font-size="15" font-weight="600" 
          fill="#38bdf8" letter-spacing="1.6">
      &gt; Full-Stack &amp; AI Systems Engineer<tspan class="cursor" fill="#38bdf8">_</tspan>
    </text>

    <!-- Motto / Tagline -->
