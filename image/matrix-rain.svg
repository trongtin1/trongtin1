    </text>

    <!-- Col 6: GEMINI AI -->
    <text x="230" y="0" class="tech-col c6">
      <tspan class="head-token">G</tspan><tspan class="bright-token">E</tspan><tspan class="bright-token">M</tspan><tspan class="mid-token">I</tspan><tspan class="mid-token">N</tspan><tspan class="dark-token">I</tspan><tspan class="dark-token">·</tspan><tspan class="dim-token">A</tspan><tspan class="dim-token">I</tspan>
    </text>

    <!-- Col 7: DOCKER -->
    <text x="275" y="0" class="tech-col c7">
