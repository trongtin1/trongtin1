    </text>

    <!-- Col 8: QDRANT -->
    <text x="320" y="0" class="tech-col c8">
      <tspan class="head-token">Q</tspan><tspan class="bright-token">D</tspan><tspan class="bright-token">R</tspan><tspan class="mid-token">A</tspan><tspan class="mid-token">N</tspan><tspan class="dark-token">T</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 9: NODE.JS -->
    <text x="365" y="0" class="tech-col c9">
      <tspan class="head-token">N</tspan><tspan class="bright-token">O</tspan><tspan class="bright-token">D</tspan><tspan class="mid-token">E</tspan><tspan class="mid-token">·</tspan><tspan class="dark-token">J</tspan><tspan class="dark-token">S</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 10: MONGODB -->
    <text x="410" y="0" class="tech-col c10">
      <tspan class="head-token">M</tspan><tspan class="bright-token">O</tspan><tspan class="bright-token">N</tspan><tspan class="mid-token">G</tspan><tspan class="mid-token">O</tspan><tspan class="dark-token">D</tspan><tspan class="dark-token">B</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 11: SIGNALR -->
    <text x="455" y="0" class="tech-col c11">
      <tspan class="head-token">S</tspan><tspan class="bright-token">I</tspan><tspan class="bright-token">G</tspan><tspan class="mid-token">N</tspan><tspan class="mid-token">A</tspan><tspan class="dark-token">L</tspan><tspan class="dark-token">R</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 12: NESTJS -->
    <text x="500" y="0" class="tech-col c12">
      <tspan class="head-token">N</tspan><tspan class="bright-token">E</tspan><tspan class="bright-token">S</tspan><tspan class="mid-token">T</tspan><tspan class="mid-token">·</tspan><tspan class="dark-token">J</tspan><tspan class="dark-token">S</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 13: NEXT.JS -->
    <text x="545" y="0" class="tech-col c13">
      <tspan class="head-token">N</tspan><tspan class="bright-token">E</tspan><tspan class="bright-token">X</tspan><tspan class="mid-token">T</tspan><tspan class="mid-token">·</tspan><tspan class="dark-token">J</tspan><tspan class="dark-token">S</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 14: PYTHON -->
    <text x="590" y="0" class="tech-col c14">
      <tspan class="head-token">P</tspan><tspan class="bright-token">Y</tspan><tspan class="bright-token">T</tspan><tspan class="mid-token">H</tspan><tspan class="mid-token">O</tspan><tspan class="dark-token">N</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 15: REST API -->
    <text x="635" y="0" class="tech-col c15">
      <tspan class="head-token">R</tspan><tspan class="bright-token">E</tspan><tspan class="bright-token">S</tspan><tspan class="mid-token">T</tspan><tspan class="mid-token">·</tspan><tspan class="dark-token">A</tspan><tspan class="dark-token">P</tspan><tspan class="dim-token">I</tspan>
    </text>

    <!-- Col 16: REDIS -->
    <text x="680" y="0" class="tech-col c16">
      <tspan class="head-token">R</tspan><tspan class="bright-token">E</tspan><tspan class="bright-token">D</tspan><tspan class="mid-token">I</tspan><tspan class="mid-token">S</tspan><tspan class="dark-token">·</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 17: GIT -->
    <text x="725" y="0" class="tech-col c17">
      <tspan class="head-token">G</tspan><tspan class="bright-token">I</tspan><tspan class="bright-token">T</tspan><tspan class="mid-token">H</tspan><tspan class="mid-token">U</tspan><tspan class="dark-token">B</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 18: PHP -->
    <text x="770" y="0" class="tech-col c18">
      <tspan class="head-token">P</tspan><tspan class="bright-token">H</tspan><tspan class="bright-token">P</tspan><tspan class="mid-token">·</tspan><tspan class="dark-token">8</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 19: TAILWIND -->
    <text x="815" y="0" class="tech-col c19">
      <tspan class="head-token">T</tspan><tspan class="bright-token">A</tspan><tspan class="bright-token">I</tspan><tspan class="mid-token">L</tspan><tspan class="mid-token">W</tspan><tspan class="dark-token">I</tspan><tspan class="dark-token">N</tspan><tspan class="dim-token">D</tspan>
    </text>

    <!-- Col 20: EF CORE -->
    <text x="855" y="0" class="tech-col c20">
      <tspan class="head-token">E</tspan><tspan class="bright-token">F</tspan><tspan class="bright-token">·</tspan><tspan class="mid-token">C</tspan><tspan class="mid-token">O</tspan><tspan class="dark-token">R</tspan><tspan class="dark-token">E</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 21: .NET / C# -->
    <text x="895" y="0" class="tech-col c21">
      <tspan class="head-token">.</tspan><tspan class="bright-token">N</tspan><tspan class="bright-token">E</tspan><tspan class="mid-token">T</tspan><tspan class="mid-token">·</tspan><tspan class="dark-token">C</tspan><tspan class="dark-token">#</tspan><tspan class="dim-token">·</tspan>
    </text>

    <!-- Col 22: AI -->
    <text x="935" y="0" class="tech-col c22">
      <tspan class="head-token">A</tspan><tspan class="bright-token">I</tspan><tspan class="bright-token">·</tspan><tspan class="mid-token">V</tspan><tspan class="mid-token">E</tspan><tspan class="dark-token">C</tspan><tspan class="dark-token">T</tspan><tspan class="dim-token">O</tspan><tspan class="dim-token">R</tspan>
    </text>
